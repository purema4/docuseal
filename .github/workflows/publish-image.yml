name: Publish Docker image

# Builds the Docker image and pushes it to GitHub Packages (ghcr.io) after the CI workflow
# passes for a push to master or a version tag (e.g. 1.2.3 or v1.2.3).
# Can also be run manually from the Actions tab (without waiting for CI).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')

    steps:
      - name: Resolve ref and tags
        id: vars
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            ref="$RUN_BRANCH"; sha="$RUN_SHA"
          else
            ref="$REF_NAME"; sha="$SHA"
          fi

          image="ghcr.io/$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          short_sha="$(echo "$sha" | cut -c1-7)"

          if echo "$ref" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
            version="${ref#v}"
            minor="$(echo "$version" | cut -d. -f1-2)"
            tags="$image:$version,$image:$minor,$image:sha-$short_sha"
          elif [ "$ref" = "master" ]; then
            version="master-$short_sha"
            tags="$image:latest,$image:master,$image:sha-$short_sha"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            safe_ref="$(echo "$ref" | tr -c 'a-zA-Z0-9._-' '-' | cut -c1-100)"
            version="$safe_ref-$short_sha"
            tags="$image:$safe_ref,$image:sha-$short_sha"
          else
            echo "Nothing to publish for $ref"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "skip=false"
            echo "sha=$sha"
            echo "version=$version"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout code
        if: steps.vars.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.vars.outputs.sha }}

      - name: Create .version file
        if: steps.vars.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: echo "$VERSION" > .version

      - name: Set up Docker Buildx
        if: steps.vars.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: steps.vars.outputs.skip == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.vars.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.vars.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.vars.outputs.sha }}
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
